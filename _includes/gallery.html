<!-- image gallery -->
<section id="gallery" class="container content-section text-center">
    <div class="container center">
        <h2>Gallery</h2>
    </div>

    <div class="row soft-margin">
      <div class="gallery">
            {% for image in site.data.images %}
              <a href="{{ image.path | relative_url }}">
                <img loading="lazy" class="img-responsive" src="{{ image.path | relative_url }}" alt="{{ image.alt }}" />
              </a>  
            {% endfor %}
      </div>    
    </div>

    <script>
        window.addEventListener('load', function() {
        baguetteBox.run('.gallery');
        });
    </script>
</section>
